<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ControleS — APP</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            color: #1f2937;
            min-height: 100vh;
        }

        header {
            background: #111827;
            color: white;
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 24px;
        }

        header span {
            font-size: 14px;
            opacity: .8;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            margin: auto;
            padding: 20px;
        }

        .welcome {
            margin-bottom: 20px;
        }

        .welcome h2 {
            font-size: 25px;
            margin-bottom: 5px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,.08);
        }

        .card p {
            color: #6b7280;
            margin-bottom: 8px;
        }

        .card h3 {
            font-size: 25px;
        }

        .positive {
            color: #16a34a;
        }

        .negative {
            color: #dc2626;
        }

        .menu {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .menu button {
            border: none;
            background: white;
            padding: 25px 15px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 3px 12px rgba(0,0,0,.08);
            transition: .2s;
        }

        .menu button:hover {
            transform: translateY(-2px);
        }

        .section {
            margin-top: 25px;
            background: white;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,.08);
        }

        .section h2 {
            margin-bottom: 15px;
        }

        .transaction {
            display: flex;
            justify-content: space-between;
            padding: 14px 0;
            border-bottom: 1px solid #eee;
        }

        .transaction:last-child {
            border-bottom: none;
        }

        .income {
            color: #16a34a;
        }

        .expense {
            color: #dc2626;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #6b7280;
        }

        @media (max-width: 700px) {
            .cards {
                grid-template-columns: 1fr;
            }

            .menu {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 450px) {
            .menu {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>ControleS</h1>
    <span>APP Financeiro</span>
</header>

<main class="container">

    <div class="welcome">
        <h2>Olá! 👋</h2>
        <p>Bem-vindo ao seu controle financeiro.</p>
    </div>

    <div class="cards">

        <div class="card">
            <p>Saldo atual</p>
            <h3>R$ 0,00</h3>
        </div>

        <div class="card">
            <p>Receitas</p>
            <h3 class="positive">R$ 0,00</h3>
        </div>

        <div class="card">
            <p>Despesas</p>
            <h3 class="negative">R$ 0,00</h3>
        </div>

    </div>

    <div class="menu">

        <button onclick="mostrar('Receitas')">
            💰<br>
            Receitas
        </button>

        <button onclick="mostrar('Despesas')">
            💸<br>
            Despesas
        </button>

        <button onclick="mostrar('Lançamentos')">
            🧾<br>
            Lançamentos
        </button>

        <button onclick="mostrar('Relatórios')">
            📈<br>
            Relatórios
        </button>

        <button onclick="mostrar('Categorias')">
            🍩<br>
            Categorias
        </button>

        <button onclick="mostrar('Premium')">
            ⭐<br>
            Premium
        </button>

    </div>

    <div class="section">

        <h2>Últimos lançamentos</h2>

        <div class="transaction">
            <span>Nenhum lançamento ainda</span>
            <span>R$ 0,00</span>
        </div>

    </div>

</main>

<footer>
    ControleS © 2026
</footer>

<script>

    function mostrar(nome) {
        alert("Você selecionou: " + nome);
    }

</script>

</body>
</html>
