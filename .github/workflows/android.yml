name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm install

      - name: Montar a pasta www
        run: |
          mkdir -p www
          cp app.html www/index.html
          cp app.css app.js sw.js www/
          cp *.png www/
          cp privacidade.html termos.html exclusao-dados.html www/

      - name: Criar projeto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Gerar APK de teste
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: controles-apk-teste
          path: android/app/build/outputs/apk/debug/app-debug.apk
