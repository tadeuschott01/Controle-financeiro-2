name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm install

      - name: Montar a pasta www
        run: |
          mkdir -p www
          cp app.html www/index.html
          cp app.css app.js sw.js www/
          cp *.png www/
          cp privacidade.html termos.html exclusao-dados.html www/

      - name: Criar projeto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Aumentar o número da versão
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          grep -n "versionCode" android/app/build.gradle

      - name: Gerar APK de teste
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: controles-apk-teste
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Restaurar a chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/controles-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/controles-release.jks" -storepass "$KEYSTORE_PASSWORD"

      - name: Gerar o AAB de release
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Assinar o AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$RUNNER_TEMP/controles-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            android/app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"

      - name: Guardar o AAB assinado
        uses: actions/upload-artifact@v4
        with:
          name: controles-aab-assinado
          path: android/app/build/outputs/bundle/release/app-release.aab
