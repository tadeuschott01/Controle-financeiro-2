<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Controle Financeiro</title>

  <link rel="stylesheet" href="style.css">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

  <!-- =====================================================
       LOGIN / CADASTRO
       ===================================================== -->

  <div id="authScreen" class="auth-screen">

    <div class="auth-card">

      <div class="brand">

        <div class="brand-icon">
          $
        </div>

        <h1>Controle Financeiro</h1>

        <p>
          Organize sua vida financeira de forma simples.
        </p>

      </div>


      <!-- =================================================
           LOGIN
           ================================================= -->

      <div id="loginForm">

        <h2>Entrar</h2>

        <p class="form-description">
          Acesse sua conta financeira.
        </p>

        <label for="loginEmail">
          E-mail
        </label>

        <input
          type="email"
          id="loginEmail"
          placeholder="seu@email.com"
          autocomplete="email"
        >

        <label for="loginPassword">
          Senha
        </label>

        <input
          type="password"
          id="loginPassword"
          placeholder="Sua senha"
          autocomplete="current-password"
        >

        <div
          id="loginMessage"
          class="message"
        ></div>

        <button
          id="loginButton"
          class="primary-button"
          type="button"
        >
          Entrar
        </button>

        <div class="switch-auth">

          Ainda não possui uma conta?

          <button
            id="showRegisterButton"
            type="button"
          >
            Criar conta
          </button>

        </div>

      </div>


      <!-- =================================================
           CADASTRO
           ================================================= -->

      <div
        id="registerForm"
        class="hidden"
      >

        <h2>Criar conta</h2>

        <p class="form-description">
          Cadastre-se para começar seu controle financeiro.
        </p>

        <label for="registerName">
          Nome
        </label>

        <input
          type="text"
          id="registerName"
          placeholder="Seu nome"
          autocomplete="name"
        >

        <label for="registerEmail">
          E-mail
        </label>

        <input
          type="email"
          id="registerEmail"
          placeholder="seu@email.com"
          autocomplete="email"
        >

        <label for="registerPassword">
          Senha
        </label>

        <input
          type="password"
          id="registerPassword"
          placeholder="Mínimo de 6 caracteres"
          autocomplete="new-password"
        >

        <label for="registerAccountType">
          Tipo de controle
        </label>

        <select id="registerAccountType">

          <option value="pessoal">
            Pessoal
          </option>

          <option value="empresa">
            Empresa
          </option>

          <option value="ambos">
            Pessoal + Empresa
          </option>

        </select>

        <div
          id="companyField"
          class="hidden"
        >

          <label for="registerCompany">
            Nome da empresa
          </label>

          <input
            type="text"
            id="registerCompany"
            placeholder="Nome da empresa"
          >

        </div>

        <div
          id="registerMessage"
          class="message"
        ></div>

        <button
          id="registerButton"
          class="primary-button"
          type="button"
        >
          Criar minha conta
        </button>

        <div class="switch-auth">

          Já possui uma conta?

          <button
            id="showLoginButton"
            type="button"
          >
            Entrar
          </button>

        </div>

      </div>

    </div>

  </div>


  <!-- =====================================================
       APLICAÇÃO
       ===================================================== -->

  <div
    id="appScreen"
    class="app-screen hidden"
  >

    <!-- SIDEBAR -->

    <aside class="sidebar">

      <div class="sidebar-brand">

        <div class="brand-icon small">
          $
        </div>

        <div>

          <strong>
            Controle Financeiro
          </strong>

          <span>
            Gestão simples
          </span>

        </div>

      </div>


      <nav class="menu">

        <button
          class="menu-item active"
          data-section="dashboard"
          type="button"
        >
          <span>📊</span>
          Dashboard
        </button>

        <button
          class="menu-item"
          data-section="transactions"
          type="button"
        >
          <span>💰</span>
          Lançamentos
        </button>

        <button
          class="menu-item"
          data-section="reports"
          type="button"
        >
          <span>📈</span>
          Relatórios
        </button>

        <button
          class="menu-item"
          data-section="profile"
          type="button"
        >
          <span>👤</span>
          Meu perfil
        </button>

      </nav>


      <div class="sidebar-bottom">

        <button
          id="logoutButton"
          class="logout-button"
          type="button"
        >
          <span>🚪</span>
          Sair
        </button>

      </div>

    </aside>
