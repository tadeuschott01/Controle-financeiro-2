<html lang="pt-BR">

  <meta charset="UTF-8">

    :root {

    * {

      color: #18201c;
      min-height: 100vh;

    button,
    input,
    select {

    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    }
